[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
requires-python = ">= 3.0"

[project]
name = "hd-hd"
authors = [{name = "Siemen Aulich"}]
version = "0.1.0"
description = "Implementation of simple grid cell models"
readme = "README.md"
dependencies = [
    "numpy",
    "matplotlib",
    "scipy",
    "jupyter",
    "ipython",
    "black",
    "tqdm",
    "black[jupyter]",
    "nbstripout",
    "pre-commit"
]

[tool.setuptools.packages.find]
where = ["."]